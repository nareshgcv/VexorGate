[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vexorgate"
version = "0.4.0"
description = "Semantic intent checks for AI agent tool calls, on System One decision models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
vexorgate = "vexorgate.__main__:main"
vexorgate-hook = "vexorgate.claude_hook:main"

[tool.setuptools]
packages = ["vexorgate"]
